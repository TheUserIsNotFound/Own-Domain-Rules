name: Update Domain Rulesets

on:
  schedule:
    - cron: '20 3 * * *' # Ежедневная проверка и обновление в 03:20 UTC (06:20 МСК)
  workflow_dispatch:     # Кнопка ручного запуска во вкладке Actions
  push:
    paths:
      - 'scripts/update_geoblock.py'
      - 'scripts/update_ip_geo_detect.py'
      - '.github/workflows/update-rulesets.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update Podkop geoblock list
        run: python3 scripts/update_geoblock.py

      - name: Update AdGuard Home IP-Geo-Detect list
        run: python3 scripts/update_ip_geo_detect.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Podkop/GeoBlock-own.lst Adguard-Home/IP-Geo-Detect.txt
          git diff --staged --quiet || (git commit -m "Update domain rulesets" && git push)
